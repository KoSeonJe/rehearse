# status: ACTIVE
# 이력서 기반 Resume Track 질문 평가 루브릭. domain 무관.
# mode-aware per_turn_rules: PLAYGROUND / INTERROGATION
rubric_id: resume-v1
description: Resume Track 전용 루브릭 (domain 무관). 사실 일치(D9) + 체인 깊이(D10) 가 핵심. ResumeMode 에 따라 채점 차원 가변.

applies_to:
  - resumeTrack: true
  - category: RESUME_BASED

uses_dimensions:
  - ref: technical_depth
    weight: 0.25
  - ref: reasoning_communication
    weight: 0.15
  - ref: experience_concreteness
    weight: 0.20
  - ref: factual_consistency   # 핵심
    weight: 0.20
  - ref: chain_depth           # 핵심
    weight: 0.20

# mode-aware: ResumeMode 에 따라 차원 선택
# - PLAYGROUND: 놀이터 모드 — 구체성만 측정
# - INTERROGATION: 심문 모드 — 깊이 + 사실 + 체인
per_turn_rules:
  on_playground_mode:    [experience_concreteness]
  on_interrogation_mode: [technical_depth, reasoning_communication, factual_consistency, chain_depth]

level_expectations:
  junior:
    must_reach_2: [factual_consistency]
    must_reach_1: all
  mid:
    must_reach_3: [factual_consistency]     # 사실 일치는 필수
    must_reach_2: all
  senior:
    must_reach_3: [factual_consistency, technical_depth, chain_depth]  # 사실 + 깊이 + 체인 모두

# status: ACTIVE
# 기술 경험 질문 평가 루브릭. FeedbackPerspective=EXPERIENCE 일 때 적용.
# domain 무관 (backend/frontend/fullstack/devops/data 공통).
# CARL 구조 + 본인 기여 구체성 + Learnings 가 핵심.
rubric_id: experience-technical-v1
description: 기술 경험 질문 평가 루브릭 (domain 무관). CARL 구조 + 수치/본인 기여 + Learnings 가 핵심. 기술 의사결정이 포함되면 Technical Depth 조건부 적용.

applies_to:
  - feedbackPerspective: EXPERIENCE

uses_dimensions:
  - ref: problem_framing
    weight: 0.15
  - ref: technical_depth   # 조건부: 기술 의사결정 포함 시
    weight: 0.20
    conditional: answer_contains_technical_decision
  - ref: reasoning_communication
    weight: 0.20
  - ref: experience_concreteness   # 핵심
    weight: 0.30
  - ref: recovery_from_gaps
    weight: 0.15

per_turn_rules:
  on_intent_answer:  [problem_framing, reasoning_communication, experience_concreteness, recovery_from_gaps]     # technical_depth 는 conditional, RubricScorer 가 런타임 판단

level_expectations:
  junior:
    must_reach_2: [experience_concreteness]
    must_reach_1: all
  mid:
    must_reach_2: all
    must_reach_3: [experience_concreteness]
  senior:
    must_reach_3: [experience_concreteness, technical_depth]   # Learnings + 기술 의사결정 깊이 필수

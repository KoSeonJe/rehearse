# status: ACTIVE
# RubricLoader 의 카테고리/QuestionType 분기에서 매칭 실패 시 사용되는 기본 루브릭.
# 대상 카테고리 (전용 rubric 미보유): SYSTEM_DESIGN / INFRA_CICD / CLOUD /
#                                     DATA_PIPELINE / SQL_MODELING /
#                                     BROWSER_PERFORMANCE / FULLSTACK_STACK
# 향후 카테고리별 전용 rubric 이 추가되면 RubricLoader.resolveRubricId 분기 추가.
rubric_id: fallback-generic-v1
description: 매핑되지 않은 카테고리용 최소 공통 루브릭. Technical Depth + Reasoning + Recovery 3차원만 평가. 전용 rubric 이 생기면 우선 적용.

applies_to:
  - fallback: true

uses_dimensions:
  - ref: technical_depth
    weight: 0.45
  - ref: reasoning_communication
    weight: 0.35
  - ref: recovery_from_gaps
    weight: 0.20

per_turn_rules:
  on_intent_answer:  [technical_depth, reasoning_communication, recovery_from_gaps]

level_expectations:
  junior:
    must_reach_1: all
  mid:
    must_reach_2: all
  senior:
    must_reach_3: [technical_depth]
    must_reach_2: all

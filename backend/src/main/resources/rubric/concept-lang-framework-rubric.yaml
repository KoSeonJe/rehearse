rubric_id: concept-lang-framework-v1
description: 언어/프레임워크 (Java/Python/JS 언어 · Spring/Express/React/Vue 프레임워크) 개념 질문 평가 루브릭. 개념 정확성 + 실무 감각이 핵심.

applies_to:

# status: ACTIVE
# 협업/갈등/커뮤니케이션 질문 평가 루브릭. BEHAVIORAL 카테고리.
# 출처: docs/todo/2026-04-20/03-m3-feedback-rubric.md L500-522
rubric_id: experience-collaboration-v1
description: 팀 협업·갈등 해결·커뮤니케이션 질문 평가 루브릭. 다관점 이해 (Collaboration Awareness) 가 핵심.

applies_to:
  - category: BEHAVIORAL

uses_dimensions:
  - ref: problem_framing
    weight: 0.15
  - ref: reasoning_communication
    weight: 0.20
  - ref: experience_concreteness
    weight: 0.30
  - ref: collaboration_awareness
    weight: 0.35

per_turn_rules:
  on_intent_clarify: []
  on_intent_give_up: []                   # 협업 질문은 "모른다" 보다 상황 재구성을 기대
  on_intent_answer:  [problem_framing, reasoning_communication, experience_concreteness, collaboration_awareness]

level_expectations:
  junior:
    must_reach_2: [experience_concreteness, collaboration_awareness]
    must_reach_1: all
  mid:
    must_reach_2: all
    must_reach_3: [collaboration_awareness]
  senior:
    must_reach_3: [experience_concreteness, collaboration_awareness]   # 다관점 이해 + 구체적 기여 필수

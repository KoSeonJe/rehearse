# status: ACTIVE
# 14차원 마스터 사전. 모든 rubric YAML 이 ref: <snake_case> 로 참조.
version: 1

dimensions:
  problem_framing:
    name: 문제 정의
    description: 질문 받고 전제/제약/엣지케이스 확인하는가
    scope: general
    scoring:
      1:
        label: 전제 확인 없음
        observable:
          - 질문을 받자마자 답변 시작
          - 제약 조건 명시 없음
          - 스케일/트래픽/규모 등 컨텍스트 언급 없음
      2:
        label: 부분 확인
        observable:
          - '하나의 가정만 명시 (~라고 가정하면)'
          - 스케일/트래픽 등 컨텍스트 일부 확인
          - 엣지케이스 1개 미만 언급
      3:
        label: 체계적 확인
        observable:
          - 여러 가정 명시적으로 나열
          - 엣지케이스 능동적으로 언급
          - '만약 ~라면으로 경계 조건 탐색'
          - 제약 확인 후 답변 범위 스스로 정의

  technical_depth:
    name: 기술적 깊이
    description: 원리/트레이드오프/대안 인지
    scope: general
    scoring:
      1:
        label: 키워드 나열
        observable:
          - 기술명만 언급, 왜 쓰는지 설명 못함
          - Redis 썼어요로 끝남
          - 대안 고려 없음
      2:
        label: 정의 수준
        observable:
          - 원리 설명 있으나 트레이드오프 없음
          - 단일 선택지만 언급
          - 장점만 말하고 단점 안 봄
      3:
        label: 트레이드오프 + 대안 인지
        observable:
          - 선택 이유를 대안과 비교해 설명
          - 단점도 솔직히 언급
          - '만약 ~한 상황이면 ~을 썼을 것'
          - 복수 옵션 간 의사결정 근거 제시

  reasoning_communication:
    name: 사고 과정 전달
    description: 사고 과정 단계적 언어화
    scope: general
    scoring:
      1:
        label: 결론만
        observable:
          - 왜냐하면 없음
          - 결론을 단언만 하고 근거 생략
          - 답변 구조가 보이지 않음
      2:
        label: 기본 설명
        observable:
          - 왜냐하면 1회
          - 단일 이유 제시
          - 순서가 있으나 단계 구분은 약함
      3:
        label: 단계적 사고 공유
        observable:
          - '먼저 ~을 고려했고, 그다음 ~을 검토했고'
          - 배제한 옵션까지 언급
          - 전제 → 추론 → 결론 구조 명시적

  conceptual_accuracy:
    name: 개념 정확성
    description: 개념 설명의 기술적 정확성
    scope: general
    scoring:
      1:
        label: 오개념 존재
        observable:
          - 기술적으로 틀린 서술
          - 용어 혼동 (프로세스 ≠ 스레드를 혼용)
          - 원리 설명에 사실 오류
      2:
        label: 대체로 정확, 일부 부정확
        observable:
          - 핵심 개념은 맞으나 디테일 틀림
          - 범위를 과대/과소 표현
          - 경계 조건에서 설명 흔들림
      3:
        label: 정확
        observable:
          - 용어 정확히 사용
          - 예외 케이스까지 인지
          - 경계 조건 정확히 설명
          - 실제 동작 메커니즘까지 서술

  practical_application:
    name: 실무 적용력
    description: 실무 사용 맥락, 주의점, 흔한 실수 이해
    scope: general
    scoring:
      1:
        label: 교과서 수준
        observable:
          - '이론만 알고 언제 쓰는지 모름'
          - 흔한 함정/버그 언급 없음
          - 실제 사용 경험 흔적 없음
      2:
        label: 일부 실무 감각
        observable:
          - 한두 가지 use case 언급
          - 주의점 일부 인지
          - 버전/호환성 정도만 언급
      3:
        label: 실무 감각
        observable:
          - '이럴 때 쓰고 이럴 땐 안 씀 구분'
          - 흔한 실수/버그 패턴 언급
          - 대안과 선택 기준 명확
          - 운영 환경 고려 (모니터링, 장애 대응)

  experience_concreteness:
    name: 경험 구체성
    description: 수치, 본인 기여, Learnings (CARL의 L)
    scope: general
    scoring:
      1:
        label: 추상적
        observable:
          - 팀에서 했어요 수준
          - 우리만 있고 나가 없음
          - 수치 0개
          - 결과만 있고 과정 없음
      2:
        label: 일부 구체화
        observable:
          - 일부 수치 포함
          - 본인 역할 일부 명시
          - 배운 점 언급 시도
      3:
        label: 완전 구체화
        observable:
          - 정량 수치 (TPS, LCP, ms, %)
          - 나는 ~했다로 명확한 본인 기여
          - 선택하지 않은 대안 언급
          - Learnings (전이 가능한 교훈)

  collaboration_awareness:
    name: 협업 인식
    description: 팀/이해관계자 관점 고려
    scope: general
    scoring:
      1:
        label: 본인 관점만
        observable:
          - 내가 주도했다만 강조
          - 다른 팀원/이해관계자 언급 없음
          - 갈등/협의 과정 생략
      2:
        label: 일부 인식
        observable:
          - 팀원 의견 한 번 언급
          - 갈등/합의 과정 일부 표현
          - 이해관계자 구분 약함
      3:
        label: 다관점 이해
        observable:
          - 여러 stakeholder 관점 언급
          - 갈등 시 타협/설득 과정 구체 설명
          - 'PM은 ~, 백엔드는 ~, 프론트는 ~ 식 구분'
          - 상대방 입장 언어로 재서술

  recovery_from_gaps:
    name: 모름 대처
    description: 모르는 걸 만났을 때 대처
    scope: general
    scoring:
      1:
        label: 회피
        observable:
          - 침묵
          - 얼버무림
          - 확신 없이 추측
          - 질문 자체를 바꿔치기
      2:
        label: 인정
        observable:
          - 그 부분은 잘 모릅니다 명시
          - 모르는 범위를 정확히 구분
      3:
        label: 인정 + 접근
        observable:
          - 모르는 걸 인정
          - 추론/유추 시도
          - 비슷한 경험으로 브릿지
          - '만약 안다면 이렇게 접근하겠다 제시'

  factual_consistency:
    name: 이력서 일관성
    description: (Resume 전용) 이력서 claim과 답변 일치
    scope: resume_only
    scoring:
      1:
        label: 불일치 다수
        observable:
          - 이력서 기재 기술명과 답변 기술명 불일치
          - 규모 수치가 이력서와 다름
          - 역할/기여도 과장
      2:
        label: 일부 불일치
        observable:
          - 한 건의 경미한 불일치
          - 용어를 유사어로 대체했으나 개념 일치
      3:
        label: 완전 일치
        observable:
          - 이력서 claim을 답변이 정확히 뒷받침
          - 숫자·기술명·역할 모두 일치
          - 추가 설명이 이력서 맥락과 정합

  chain_depth:
    name: 심화 답변 깊이
    description: (Resume 전용) 심화 체인 어디까지 답했는가 (L1 What → L2 How → L3 Why-mech → L4 Tradeoff)
    scope: resume_only
    scoring:
      1:
        label: L1 (What)까지
        observable:
          - 개념 설명 수준까지만
          - 무엇을 했는가에서 멈춤
      2:
        label: L2-L3 (How/Why)까지
        observable:
          - 라이브러리/알고리즘까지 설명
          - 구현 메커니즘·이유 일부 제시
      3:
        label: L4 (Tradeoff)까지
        observable:
          - 선택 근거와 대안 비교까지 도달
          - '~대신 ~을 택한 이유를 복수 관점에서 서술'
          - 운영/확장성 관점 포함

  fluency:
    name: 발화 유창성
    description: 필러·말 더듬·발화 속도 변동이 답변 전달을 방해하지 않는가
    scope: nonverbal
    category: nonverbal
    data_source: lambda.nonverbalScore.d11
    measurement: 필러 횟수 + 더듬·재시작 빈도 + 발화 속도 변동 (이전 raw speechPace / speedVariance 흡수)
    scoring:
      1:
        label: 전달 흐름이 잦게 끊김
        observable:
          - 필러 워드 6회 이상으로 답변 흐름이 반복적으로 끊김
          - 같은 어절을 다시 시작하거나 말을 더듬는 구간이 답변 내 3회 이상
          - 발화 속도가 갑자기 빨라지거나 늦춰지는 변동이 뚜렷함
      2:
        label: 전달 흐름이 간헐적으로 흔들림
        observable:
          - 필러 워드 3~5회로 핵심 전달은 가능하지만 간헐적으로 흔들림
          - 더듬·재시작이 답변 내 1~2회 발생
          - 발화 속도 변동이 일부 구간에서 감지됨
      3:
        label: 전달 흐름이 안정적
        observable:
          - 필러 워드 2회 이하이고 답변 흐름이 안정적으로 이어짐
          - 더듬·재시작이 거의 없음
          - 발화 속도가 답변 전체에서 일정하게 유지됨

  confidence_tone:
    name: 자신감 있는 말투
    description: 톤과 발화 속도 변동이 자신감 있게 유지되는가
    scope: nonverbal
    category: nonverbal
    data_source: lambda.nonverbalScore.d12
    measurement: 톤 안정성 (단정형 어미 / 끝맺음 명확 / 음량 떨림) + 발화 속도 분산 (이전 raw toneConfidenceLevel / emotionLabel / speedVariance 흡수)
    scoring:
      1:
        label: 자신감 부족
        observable:
          - 어미가 추측형·의문형으로 흐려지고 문장 끝이 불분명함
          - 음량이 떨리거나 잦아드는 구간이 답변 내 자주 보임
          - 발화 속도 분산 0.30 이상으로 톤이 불안정하게 흔들림
      2:
        label: 보통
        observable:
          - 일부 문장은 단정형이지만 다른 문장은 끝이 흐려짐
          - 음량이나 톤이 답변 일부 구간에서만 흔들림
          - 발화 속도 변동이 약하게 감지되지만 핵심 전달은 가능
      3:
        label: 자신감 있음
        observable:
          - 단정형 어미와 명확한 끝맺음이 답변 전체에서 유지됨
          - 음량 떨림이 거의 없고 톤이 안정적으로 유지됨
          - 발화 속도 분산 0.15 미만으로 일정한 톤이 이어짐

  eye_contact_posture:
    name: 시선과 자세
    description: 시선·자세·표정이 안정적으로 유지되는가
    scope: nonverbal
    category: nonverbal
    data_source: lambda.nonverbalScore.d13
    measurement: 카메라 응시 비율 + 자세 안정성 (흔들림·기울임 빈도) + 표정 안정성 (NERVOUS / UNCERTAIN / NEUTRAL 등 — 이전 raw eyeContactLevel / postureLevel / expressionLabel / gazeOnCameraRatio / postureUnstableCount 흡수)
    scoring:
      1:
        label: 불안정
        observable:
          - 카메라 응시 비율 0.30 미만으로 시선이 자주 이탈함
          - 자세 흔들림·기울임이 5회 초과로 빈번하게 발생
          - 표정이 NERVOUS / UNCERTAIN 으로 답변 시간의 30% 이상 유지됨
      2:
        label: 보통
        observable:
          - 시선이나 자세가 일부 구간에서 흔들리지만 전반 전달은 유지됨
          - 자세 흔들림이 간헐적으로 발생
          - 표정이 대체로 평탄하거나 일부 구간에서만 긴장이 드러남
      3:
        label: 안정적
        observable:
          - 카메라 응시 비율 0.70 초과로 시선이 일관되게 유지됨
          - 자세 흔들림 2회 이하로 안정적으로 유지됨
          - 표정이 ENGAGED / CONFIDENT 또는 NEUTRAL 로 이완된 상태를 유지함

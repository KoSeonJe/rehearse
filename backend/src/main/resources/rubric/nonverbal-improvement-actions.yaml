# status: ACTIVE
version: 1
actions_id: nonverbal-actions-v1

actions:
  fluency:
    level_1_to_2:
      - 답변 시작 전 2초 동안 핵심 키워드 2개만 정리하고 말하기
      - 문장 사이 침묵을 필러 워드 대신 허용하기
    level_2_to_3:
      - 첫 문장을 짧게 고정해 답변 진입부를 안정화하기
      - 녹화 리플레이에서 반복 필러 워드 1개를 골라 제거 연습하기

  confidence_tone:
    level_1_to_2:
      - 결론 문장을 먼저 말한 뒤 근거를 붙이는 순서로 답변하기
      - 빠르게 말하는 구간 뒤 의도적으로 한 박자 쉬기
    level_2_to_3:
      - 핵심 주장마다 수치나 사례 한 개를 붙여 확신의 근거 만들기
      - 문장 끝을 흐리지 않고 완결형으로 마무리하기

  eye_contact_posture:
    level_1_to_2:
      - 답변 중 첫 5초와 마지막 5초는 카메라를 보고 말하기
      - 의자 등받이에 기대지 않고 상체 각도를 고정하기
    level_2_to_3:
      - 메모 확인 후 즉시 카메라로 시선을 복귀하는 루틴 만들기
      - 질문을 들을 때와 결론을 말할 때 같은 자세 유지하기

  composure:
    level_1_to_2:
      - 어려운 질문을 받으면 먼저 모르는 범위와 접근 순서를 분리해 말하기
      - 후속 질문 전 한 문장으로 현재 답변 요지를 재정리하기
    level_2_to_3:
      - 압박 질문에서도 결론-근거-한계 순서를 유지하기
      - 난이도 높은 질문 뒤 다음 답변의 첫 문장 속도를 낮추기

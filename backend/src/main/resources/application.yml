spring:
  application:
    name: rehearse-api
  profiles:
    active: local

  threads:
    virtual:
      enabled: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-connections: 8192
    accept-count: 100

resilience4j:
  ratelimiter:
    instances:
      openai-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 120s
      claude-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 120s
      whisper-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 120s

app:
  admin:
    password: ${ADMIN_PASSWORD}

ai:
  resume:
    question-generator:
      temperature: ${RESUME_QUESTION_TEMPERATURE:0.7}

rehearse:
  interview:
    policy:
      standard:
        max-follow-up-rounds: 2
    retry:
      max-attempts: 5
      cooldown-seconds: 30
    audio:
      max-bytes: 10485760
      max-duration-seconds: 300
      mime-whitelist:
        - audio/webm
        - audio/mp4
        - audio/mpeg
        - audio/wav
  answer-analyzer:
    # plan-02 Step A. 기본 ON, runtime toggle 없음 (Feature Flag 철거 정책)
    enabled: true
  feedback-synthesizer:
    delivery-timeout-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true


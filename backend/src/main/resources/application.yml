spring:
  application:
    name: rehearse-api
  profiles:
    active: local

  threads:
    virtual:
      enabled: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-connections: 8192
    accept-count: 100

resilience4j:
  ratelimiter:
    instances:
      openai-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 120s
      claude-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 120s
      whisper-api:
        limitForPeriod: 50
        limitRefreshPeriod: 1s
        timeoutDuration: 120s

app:
  admin:
    password: ${ADMIN_PASSWORD}

openai:
  audio-model: ${OPENAI_AUDIO_MODEL:gpt-4o-mini-audio-preview}

ai:
  resume:
    skeleton:
      model: ${RESUME_SKELETON_MODEL:gpt-5.4-mini}
      base-url: ${RESUME_SKELETON_BASE_URL:https://api.openai.com/v1/responses}
      timeout-ms: ${RESUME_SKELETON_TIMEOUT_MS:60000}
      max-tokens: ${RESUME_SKELETON_MAX_TOKENS:12000}
      temperature: ${RESUME_SKELETON_TEMPERATURE:0.2}

rehearse:
  interview:
    policy:
      standard:
        max-follow-up-rounds: 2
    retry:
      max-attempts: 5
      cooldown-seconds: 30
    audio:
      max-bytes: 10485760
      max-duration-seconds: 300
      mime-whitelist:
        - audio/webm
        - audio/mp4
        - audio/mpeg
        - audio/wav
  answer-analyzer:
    # plan-02 Step A. 기본 ON, runtime toggle 없음 (Feature Flag 철거 정책)
    enabled: true
  context-engineering:
    l1-caching: true
    l3-compaction-threshold: 5
    l3-recent-window: 5
    l4-just-in-time: true
    max-context-tokens: 8000
  resume-planner:
    model: ${RESUME_PLANNER_MODEL:gpt-5.4-mini}
    temperature: 0.3
    max-tokens: 2048
  resume-track:
    model: ${RESUME_TRACK_MODEL:gpt-5.4-mini}
    temperature: 0.7
    max-tokens: 800
    playground-max-turns: 3
    chain-max-depth: 4
    hard-timeout-min: 10
  rubric-scorer:
    model: ${RUBRIC_SCORER_MODEL:gpt-5.4-mini}
    temperature: 0.2
    max-tokens: 1536
  feedback-rubric:
    family-version: v1
    fallback-rubric: fallback-generic-v1
    mode-aware: true
  feedback-synthesizer:
    model: ${FEEDBACK_SYNTHESIZER_MODEL:gpt-5.4-mini}
    temperature: 0.3
    max-tokens: 2048
    delivery-timeout-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true


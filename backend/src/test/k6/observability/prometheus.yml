# 관측 전용 EC2#2 의 Prometheus scrape config.
# 측정 대상은 EC2#1 (app:8080 + node_exporter:9100). 동일 VPC 사설IP 로 scrape.
# target = EC2#1 사설IP 172.31.14.143 (stop/start 불변 — 퍼블릭IP 변동 회피).
#   EC2#1 재생성/사설IP 변경 시에만 갱신. (퍼블릭IP 갱신 불필요)

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    env: loadtest

scrape_configs:
  - job_name: spring-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['172.31.14.143:8080']
        labels:
          instance: rehearse-loadtest-app

  - job_name: node-exporter
    static_configs:
      - targets: ['172.31.14.143:9100']
        labels:
          instance: rehearse-loadtest-host

spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: test-github-client-id
            client-secret: test-github-client-secret
            scope: read:user,user:email
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope: email,profile

# Live LLM E2E — OPENAI_API_KEY 환경변수에서 주입. 누락 시 테스트는 assumeTrue 로 스킵.
claude:
  api-key: ${ANTHROPIC_API_KEY:disabled}

openai:
  api-key: ${OPENAI_API_KEY:disabled}

aws:
  enabled: false

google:
  tts:
    enabled: false

jwt:
  secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tcHJvdmlkZXItdGVzdC1tdXN0LWJlLTI1Ni1iaXRzIQ==
  expiration-ms: 3600000

app:
  frontend-url: http://localhost:5173
  admin:
    password: test-admin-password

cors:
  allowed-origins: http://localhost:5173

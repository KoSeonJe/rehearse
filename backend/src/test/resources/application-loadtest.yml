server:
  tomcat:
    threads:
      max: 200

spring:
  threads:
    virtual:
      enabled: ${VIRTUAL_THREAD_ENABLED:true}

  datasource:
    url: jdbc:mysql://localhost:3306/rehearse_loadtest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: loadtest
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # jar 단독 부팅 시 oauth2Login 자동설정이 ClientRegistration 빈을 요구 → 더미 등록 (loadtest 는 OAuth 플로우 미사용)
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: loadtest-dummy-github-client-id
            client-secret: loadtest-dummy-github-client-secret
            scope: read:user,user:email
          google:
            client-id: loadtest-dummy-google-client-id
            client-secret: loadtest-dummy-google-client-secret
            scope: email,profile

# CORS
cors:
  allowed-origins: http://localhost:5173

# JWT — loadtest 전용 더미. secret 은 BASE64 디코딩 후 HS256 키로 사용되므로 32바이트+ base64 필수
jwt:
  secret: bG9hZHRlc3RKd3RTZWNyZXRLZXlOb3RBUmVhbFNlY3JldE1pbmltdW0zMkNoYXJz
  expiration-ms: 604800000

# 외부 의존 비활성 — 부하 변수 통제 + jar 단독 부팅
aws:
  enabled: false

google:
  tts:
    enabled: false

app:
  frontend-url: http://localhost:3000
  admin:
    password: loadtest-dummy-admin-password

# 외부 API → Mock Server (localhost:9090)
claude:
  api-key: sk-test-dummy-key

openai:
  api-key: sk-test-dummy-key
  api:
    url: http://localhost:9090/v1/audio/transcriptions

# Resilience4j — GPT-4o Tier 1 기준 (500 RPM = ~8 req/s)
resilience4j:
  ratelimiter:
    instances:
      claude-api:
        limitForPeriod: ${RATELIMITER_LIMIT:8}
        limitRefreshPeriod: 1s
        timeoutDuration: ${RATELIMITER_TIMEOUT:60s}
      whisper-api:
        limitForPeriod: ${RATELIMITER_LIMIT:8}
        limitRefreshPeriod: 1s
        timeoutDuration: ${RATELIMITER_TIMEOUT:60s}

# 글로벌 동시성 제한 (0 = 비활성화)
api:
  global-concurrency-limit: ${GLOBAL_CONCURRENCY_LIMIT:0}

# Actuator metrics 활성화
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info, prometheus
  endpoint:
    health:
      show-details: always

# 내부 API 키
internal:
  api-key: loadtest-key
